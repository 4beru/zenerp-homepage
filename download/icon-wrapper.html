<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zen ERP icon wrapper</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #050505;
  }
  .wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img { display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="http://localhost:3000/zen-logo.svg" id="lotus" alt="">
  </div>
  <script>
    // ?scale=0.84 (any) | ?scale=0.70 (maskable, dentro de la safe zone 80%)
    const params = new URLSearchParams(location.search);
    const scale = params.get('scale') || '0.84';
    const img = document.getElementById('lotus');
    img.style.width = (parseFloat(scale) * 100) + '%';
    img.style.height = 'auto';
  </script>
</body>
</html>
